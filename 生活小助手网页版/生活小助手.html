<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生活小助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ============================================================
     主题配色系统（5 套马卡龙色板，与小程序一致）
     通过 .theme-{name} 切换整套配色，挂在 .screen 根节点
     ============================================================ */
  .theme-default {
    --theme-bg: #FDF8F4; --theme-primary: #F4B8B8; --theme-primary-rgb: 244,184,184;
    --theme-accent: #B0D9B1; --theme-accent-rgb: 176,217,177; --theme-text: #5E4B3C;
    --theme-text-secondary: #C88E8E; --theme-text-tertiary: #D99B9B;
    --theme-border: #FAE5E5; --theme-card-bg: #FFFFFF; --theme-pill-bg: #FFF4E6;
    --theme-primary-light: rgba(244,184,184,0.15); --theme-accent-light: rgba(176,217,177,0.15);
    --theme-check-border: #F5CCCC; --theme-avatar-border: rgba(244,184,184,0.3);
    --theme-settings-icon-bg: rgba(244,184,184,0.12); --theme-cat-btn-bg: rgba(244,184,184,0.1);
    --theme-profile-gradient-start: #FFFFFF; --theme-profile-gradient-end: #FFF8F4;
    --theme-income: #168354; --theme-expense: #CF4F4F; --theme-disabled: #E0E0E0;
    --theme-overlay: rgba(193,124,138,0.94); --theme-shadow: rgba(114,95,95,0.25);
    --theme-shadow-light: rgba(114,95,95,0.12); --theme-handle: rgba(200,142,142,0.3);
    --theme-gradient-start: #F4B8B8; --theme-gradient-end: #B0D9B1;
    --theme-weight: #7B4B8A; --theme-weight-light: #B39DDB;
    --theme-record-dot: rgba(200,142,142,0.25); --theme-record-text: #8B7355;
    --theme-complete: #81C784; --theme-normal-text: #999; --theme-ref-text: #6FA870;
    --theme-tab-bg: #FFF4E6;
  }
  .theme-warm {
    --theme-bg: #FFF8F0; --theme-primary: #FF8A65; --theme-primary-rgb: 255,138,101;
    --theme-accent: #FFCC80; --theme-accent-rgb: 255,204,128; --theme-text: #4E3B2C;
    --theme-text-secondary: #BCAAA4; --theme-text-tertiary: #A1887F;
    --theme-border: #F5EBE1; --theme-card-bg: #FFFFFF; --theme-pill-bg: #FFF3E0;
    --theme-primary-light: rgba(255,138,101,0.13); --theme-accent-light: rgba(255,204,128,0.13);
    --theme-check-border: #FFCCB4; --theme-avatar-border: rgba(255,138,101,0.3);
    --theme-settings-icon-bg: rgba(255,138,101,0.12); --theme-cat-btn-bg: rgba(255,138,101,0.1);
    --theme-profile-gradient-start: #FFFFFF; --theme-profile-gradient-end: #FFF8F0;
    --theme-income: #2E7D32; --theme-expense: #D84315; --theme-disabled: #E0E0E0;
    --theme-overlay: rgba(206,130,96,0.94); --theme-shadow: rgba(62,39,35,0.22);
    --theme-shadow-light: rgba(62,39,35,0.1); --theme-handle: rgba(188,170,164,0.3);
    --theme-gradient-start: #FF8A65; --theme-gradient-end: #FFCC80;
    --theme-weight: #7B4B8A; --theme-weight-light: #B39DDB;
    --theme-record-dot: rgba(188,170,164,0.25); --theme-record-text: #6D5D56;
    --theme-complete: #81C784; --theme-normal-text: #999; --theme-ref-text: #5D8A6E;
    --theme-tab-bg: #FFF3E0;
  }
  .theme-cool {
    --theme-bg: #F0F7FA; --theme-primary: #4FC3F7; --theme-primary-rgb: 79,195,247;
    --theme-accent: #80CBC4; --theme-accent-rgb: 128,203,196; --theme-text: #37474F;
    --theme-text-secondary: #90A4AE; --theme-text-tertiary: #78909C;
    --theme-border: #C8DCE6; --theme-card-bg: #FFFFFF; --theme-pill-bg: #E1F5FE;
    --theme-primary-light: rgba(79,195,247,0.12); --theme-accent-light: rgba(128,203,196,0.12);
    --theme-check-border: #B4DCEC; --theme-avatar-border: rgba(79,195,247,0.3);
    --theme-settings-icon-bg: rgba(79,195,247,0.12); --theme-cat-btn-bg: rgba(79,195,247,0.1);
    --theme-profile-gradient-start: #FFFFFF; --theme-profile-gradient-end: #F0F7FA;
    --theme-income: #2E7D32; --theme-expense: #E53935; --theme-disabled: #E0E0E0;
    --theme-overlay: rgba(95,140,170,0.94); --theme-shadow: rgba(38,50,56,0.22);
    --theme-shadow-light: rgba(38,50,56,0.1); --theme-handle: rgba(144,164,174,0.3);
    --theme-gradient-start: #4FC3F7; --theme-gradient-end: #80CBC4;
    --theme-weight: #5C6BC0; --theme-weight-light: #9FA8DA;
    --theme-record-dot: rgba(144,164,174,0.25); --theme-record-text: #546E7A;
    --theme-complete: #66BB6A; --theme-normal-text: #999; --theme-ref-text: #5D8A6E;
    --theme-tab-bg: #E1F5FE;
  }
  .theme-fresh {
    --theme-bg: #F2F8EB; --theme-primary: #9FD49A; --theme-primary-rgb: 159,212,154;
    --theme-accent: #C2E6BC; --theme-accent-rgb: 194,230,188; --theme-text: #5E7C4F;
    --theme-text-secondary: #8FB585; --theme-text-tertiary: #A9C89C;
    --theme-border: #C8E6C8; --theme-card-bg: #FFFFFF; --theme-pill-bg: #E0F0D4;
    --theme-primary-light: rgba(159,212,154,0.18); --theme-accent-light: rgba(194,230,188,0.2);
    --theme-check-border: #B4D9B4; --theme-avatar-border: rgba(159,212,154,0.3);
    --theme-settings-icon-bg: rgba(159,212,154,0.12); --theme-cat-btn-bg: rgba(159,212,154,0.1);
    --theme-profile-gradient-start: #FFFFFF; --theme-profile-gradient-end: #F2F8EB;
    --theme-income: #2E7D32; --theme-expense: #C62828; --theme-disabled: #E0E0E0;
    --theme-overlay: rgba(95,140,110,0.94); --theme-shadow: rgba(94,124,79,0.18);
    --theme-shadow-light: rgba(94,124,79,0.09); --theme-handle: rgba(159,212,154,0.4);
    --theme-gradient-start: #9FD49A; --theme-gradient-end: #C2E6BC;
    --theme-weight: #7B4B8A; --theme-weight-light: #B39DDB;
    --theme-record-dot: rgba(159,212,154,0.25); --theme-record-text: #558B2F;
    --theme-complete: #81C784; --theme-normal-text: #999; --theme-ref-text: #5D8A6E;
    --theme-tab-bg: #E2EFD6;
  }
  .theme-purple {
    --theme-bg: #F8F4FC; --theme-primary: #AB47BC; --theme-primary-rgb: 171,71,188;
    --theme-accent: #CE93D8; --theme-accent-rgb: 206,147,216; --theme-text: #4A148C;
    --theme-text-secondary: #BA68C8; --theme-text-tertiary: #CE93D8;
    --theme-border: #E1D2EB; --theme-card-bg: #FFFFFF; --theme-pill-bg: #F3E5F5;
    --theme-primary-light: rgba(171,71,188,0.12); --theme-accent-light: rgba(206,147,216,0.12);
    --theme-check-border: #D7BEE1; --theme-avatar-border: rgba(171,71,188,0.3);
    --theme-settings-icon-bg: rgba(171,71,188,0.12); --theme-cat-btn-bg: rgba(171,71,188,0.1);
    --theme-profile-gradient-start: #FFFFFF; --theme-profile-gradient-end: #F8F4FC;
    --theme-income: #2E7D32; --theme-expense: #C62828; --theme-disabled: #E0E0E0;
    --theme-overlay: rgba(130,100,160,0.94); --theme-shadow: rgba(74,20,140,0.22);
    --theme-shadow-light: rgba(74,20,140,0.1); --theme-handle: rgba(171,71,188,0.3);
    --theme-gradient-start: #AB47BC; --theme-gradient-end: #CE93D8;
    --theme-weight: #7B4B8A; --theme-weight-light: #B39DDB;
    --theme-record-dot: rgba(186,104,200,0.25); --theme-record-text: #6A1B9A;
    --theme-complete: #81C784; --theme-normal-text: #999; --theme-ref-text: #5D8A6E;
    --theme-tab-bg: #F3E5F5;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #E9E2DC;
    display: flex; justify-content: center;
    min-height: 100vh;
  }

  .screen {
    --app-font-scale: 1; --app-font-weight: 400;
    width: 100%; max-width: 430px; min-height: 100vh;
    background: var(--theme-bg);
    display: flex; flex-direction: column; position: relative;
    overflow-x: hidden; color: var(--theme-text);
    font-weight: var(--app-font-weight);
    box-shadow: 0 0 40px rgba(0,0,0,0.08);
  }

  /* ===== 状态栏 ===== */
  .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; background: var(--theme-bg); flex-shrink: 0; }
  .status-bar .time { font-size: calc(15px * var(--app-font-scale)); font-weight: 600; color: var(--theme-text); }
  .status-right { display: flex; align-items: center; gap: 5px; }

  /* ===== 顶部栏 ===== */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 10px; flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .hamburger { width: 38px; height: 38px; border-radius: 50%; background: var(--theme-pill-bg); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--theme-text-secondary); font-size: 20px; flex-shrink: 0; }
  .topbar-title { font-size: calc(20px * var(--app-font-scale)); font-weight: 700; color: var(--theme-text-tertiary); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--theme-pill-bg); color: var(--theme-text-secondary); }

  /* ===== 页面容器 ===== */
  .page { display: none; flex: 1; flex-direction: column; }
  .page.active { display: flex; }
  .content-wrapper { flex: 1; padding: 8px 16px 110px; display: flex; flex-direction: column; gap: 14px; background: var(--theme-bg); }

  /* ===== 通用卡片 ===== */
  .card { padding: 18px; display: flex; flex-direction: column; gap: 14px; border-radius: 22px; background: var(--theme-card-bg); border: 1.5px solid var(--theme-border); box-shadow: 0 4px 12px var(--theme-shadow-light); }
  .card-header { display: flex; justify-content: space-between; align-items: center; }
  .card-header-left { display: flex; align-items: center; gap: 8px; }
  .card-title { font-size: calc(16px * var(--app-font-scale)); font-weight: 700; color: var(--theme-text-secondary); }

  /* ===== 按钮 ===== */
  .btn { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 12px; border-radius: 20px; border: none; cursor: pointer; width: 100%; transition: opacity .15s, transform .15s; }
  .btn-green { background: var(--theme-accent); box-shadow: 0 3px 8px rgba(var(--theme-accent-rgb),0.3); }
  .btn-pink { background: var(--theme-primary); box-shadow: 0 3px 8px rgba(var(--theme-primary-rgb),0.3); }
  .btn-text { font-size: calc(14px * var(--app-font-scale)); font-weight: 600; color: #FFFFFF; }
  .btn:active { opacity: 0.85; transform: scale(0.98); }

  /* ===== 余额卡片 ===== */
  .balance-card { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; gap: 14px; border-radius: 22px; background: linear-gradient(135deg, var(--theme-gradient-start) 0%, var(--theme-gradient-end) 100%); box-shadow: 0 6px 15px var(--theme-shadow); cursor: pointer; }
  .balance-left { display: flex; flex-direction: column; gap: 4px; }
  .balance-label { font-size: calc(13px * var(--app-font-scale)); font-weight: 500; color: #FFFFFF; }
  .balance-value { font-size: calc(26px * var(--app-font-scale)); font-weight: 700; color: #FFFFFF; }
  .balance-split { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .balance-split-tag { font-size: calc(11px * var(--app-font-scale)); padding: 2px 10px; border-radius: 12px; background: rgba(255,255,255,0.22); color: #FFFFFF; }
  .balance-right { width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ===== 统计行 ===== */
  .stats-row { display: flex; gap: 10px; }
  .stat-card { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 4px; border-radius: 16px; background: var(--theme-card-bg); border: 1.5px solid var(--theme-border); }
  .stat-label { font-size: calc(11px * var(--app-font-scale)); color: var(--theme-text-secondary); }
  .stat-value { font-size: calc(15px * var(--app-font-scale)); font-weight: 700; color: var(--theme-text); }

  /* ===== 支出/记录列表 ===== */
  .expense-list { display: flex; flex-direction: column; gap: 10px; }
  .expense-item { display: flex; justify-content: space-between; align-items: center; }
  .expense-item-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .cat-dot { width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; }
  .expense-text { font-size: calc(14px * var(--app-font-scale)); color: var(--theme-text); }
  .expense-amount { font-size: calc(14px * var(--app-font-scale)); font-weight: 600; color: var(--theme-text); }
  .amount-income { color: var(--theme-income); } .amount-expense { color: var(--theme-expense); }
  .scope-tag { font-size: calc(10px * var(--app-font-scale)); padding: 1px 6px; border-radius: 6px; flex-shrink: 0; }
  .scope-family { background: #FCE4EC; color: #E91E63; } .scope-personal { background: #E0F7FA; color: #00BCD4; }

  /* ===== 筛选 pill ===== */
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-pill { padding: 7px 14px; border-radius: 16px; font-size: calc(12px * var(--app-font-scale)); cursor: pointer; transition: all .15s; border: none; font-family: inherit; background: var(--theme-pill-bg); color: var(--theme-text-secondary); }
  .filter-pill.active { background: var(--theme-primary); color: #FFFFFF; font-weight: 600; }

  /* ===== 环形图 ===== */
  .chart-area { display: flex; align-items: center; gap: 16px; }
  .doughnut-chart { width: 120px; height: 120px; flex-shrink: 0; position: relative; }
  .legend-column { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; }
  .legend-text { flex: 1; font-size: calc(13px * var(--app-font-scale)); color: var(--theme-text); }
  .legend-amount { font-size: calc(13px * var(--app-font-scale)); font-weight: 600; color: var(--theme-text); }
  .legend-amount.zero { font-weight: 400; color: #CCCCCC; }

  /* ===== 复选列表 ===== */
  .check-list { display: flex; flex-direction: column; gap: 10px; }
  .check-item { display: flex; align-items: center; gap: 10px; }
  .checkbox { width: 20px; height: 20px; border-radius: 6px; background: var(--theme-card-bg); border: 2px solid var(--theme-check-border); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .checkbox.checked { background: var(--theme-accent); border-color: var(--theme-accent); }
  .checkbox.checked::after { content: ''; width: 6px; height: 10px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px); }
  .check-item-name { flex: 1; font-size: calc(14px * var(--app-font-scale)); color: var(--theme-text); }
  .check-item-price { font-size: calc(14px * var(--app-font-scale)); font-weight: 500; color: var(--theme-text-tertiary); }
  .check-item-delete, .li-del-btn { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.4; flex-shrink: 0; color: var(--theme-text-secondary); }
  .check-item-delete:active, .li-del-btn:active { opacity: 1; }

  /* ===== 今日生活指数 ===== */
  .life-index-grid { display: flex; flex-direction: column; gap: 10px; }
  .life-index-item { width: 100%; padding: 14px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; position: relative; touch-action: none; user-select: none; }
  .life-index-item:active { transform: scale(0.98); }
  .life-index-item.dragging { opacity: 0.4; transform: scale(0.96); }
  .life-index-item-header { display: flex; align-items: center; gap: 10px; }
  .life-index-icon { width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .life-index-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .life-index-label { font-size: calc(11px * var(--app-font-scale)); color: var(--theme-text-secondary); }
  .life-index-value { font-size: calc(14px * var(--app-font-scale)); font-weight: 600; color: var(--theme-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .life-index-edit-icon { flex-shrink: 0; opacity: 0.35; }
  .life-index-records { display: flex; flex-direction: column; gap: 6px; padding-left: 46px; }
  .life-index-record { display: flex; align-items: center; gap: 8px; font-size: calc(12px * var(--app-font-scale)); color: var(--theme-record-text); min-width: 0; }
  .life-index-record-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--theme-record-dot); flex-shrink: 0; }
  .life-index-record-dot.done { background: var(--theme-complete); }
  .life-index-record-bar { width: 3px; height: 14px; border-radius: 2px; flex-shrink: 0; }
  .life-index-record-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .life-index-record-text.done { text-decoration: line-through; opacity: 0.45; }
  .life-index-record-meta { font-size: calc(10px * var(--app-font-scale)); color: var(--theme-text-secondary); flex-shrink: 0; }
  .life-index-more { font-size: calc(11px * var(--app-font-scale)); color: var(--theme-text-secondary); padding-left: 16px; }
  .life-index-weight-display { display: flex; align-items: baseline; gap: 6px; }
  .life-index-weight-num { font-size: calc(22px * var(--app-font-scale)); font-weight: 700; color: var(--theme-weight); }
  .life-index-weight-unit { font-size: calc(12px * var(--app-font-scale)); color: var(--theme-weight-light); }
  .life-index-weight-trend { font-size: calc(11px * var(--app-font-scale)); color: var(--theme-text-secondary); margin-left: 4px; }

  /* ===== 生活指数模块弹窗内容 ===== */
  .li-module-body { max-height: 46vh; overflow-y: auto; }
  .li-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .li-input-row .modal-input { flex: 1; padding: 10px 14px; font-size: calc(14px * var(--app-font-scale)); border-radius: 12px; }
  .li-add-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--theme-primary); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .li-empty { text-align: center; padding: 24px 0; color: var(--theme-text-tertiary); font-size: calc(13px * var(--app-font-scale)); }
  .li-todo-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #fff; border-radius: 12px; margin-bottom: 8px; }
  .li-todo-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--theme-primary); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .li-todo-check.done { background: var(--theme-primary); border-color: var(--theme-primary); }
  .li-todo-text { flex: 1; font-size: calc(14px * var(--app-font-scale)); color: var(--theme-text); min-width: 0; }
  .li-todo-item.done .li-todo-text { text-decoration: line-through; color: var(--theme-text-secondary); opacity: 0.6; }
  .li-checkin-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: #fff; border-radius: 12px; margin-bottom: 8px; }
  .li-checkin-name { flex: 1; font-size: calc(14px * var(--app-font-scale)); color: var(--theme-text); min-width: 0; }
  .li-checkin-streak { font-size: calc(11px * var(--app-font-scale)); color: var(--theme-normal-text); flex-shrink: 0; }
  .li-checkin-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--theme-accent); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .li-checkin-btn.checked { background: var(--theme-accent); border-color: var(--theme-accent); }
  .li-priority-selector { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
  .li-priority-pill { padding: 5px 14px; border-radius: 20px; font-size: calc(12px * var(--app-font-scale)); border: 1.5px solid #eee; background: #fff; cursor: pointer; color: #999; transition: all .15s; }
  .li-priority-pill.active[data-p="high"] { background: var(--theme-primary); border-color: var(--theme-primary); color: #fff; font-weight: 600; }
  .li-priority-pill.active[data-p="medium"] { background: #FFD54F; border-color: #FFD54F; color: #fff; font-weight: 600; }
  .li-priority-pill.active[data-p="low"] { background: var(--theme-accent); border-color: var(--theme-accent); color: #fff; font-weight: 600; }
  .li-task-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border-radius: 12px; margin-bottom: 8px; }
  .li-task-bar { width: 4px; height: 28px; border-radius: 2px; flex-shrink: 0; }
  .li-task-bar[data-p="high"] { background: var(--theme-primary); } .li-task-bar[data-p="medium"] { background: #FFD54F; } .li-task-bar[data-p="low"] { background: var(--theme-accent); }
  .li-task-info { flex: 1; min-width: 0; }

  /* ===== 日常用品 / 进度条 ===== */

  .recipe-tag.cat-seasoning { background: #FFF8E1; color: #F57F17; } .recipe-tag.cat-staple { background: #E3F2FD; color: #1565C0; }

  .recipe-delete, .med-delete, .station-del, .person-del { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 10px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity .15s; color: var(--theme-text-secondary); }

  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch(e){}

  function load(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var d = JSON.parse(raw);
      // 浅合并保护，避免缺字段
      S = Object.assign(defaultState(), d);
      S.user = Object.assign(defaultState().user, d.user||{});
      S.font = Object.assign(defaultState().font, d.font||{});
      S.pages = Object.assign(defaultState().pages, d.pages||{});
      S.account = Object.assign(defaultState().account, d.account||{});
      S.supplies = d.supplies || defaultState().supplies;
      S.pickups = d.pickups || defaultState().pickups;
      S.medication = Object.assign(defaultState().medication, d.medication||{});
      S.lifeIndex = d.lifeIndex || defaultState().lifeIndex;
      if(!S.medication.currentPersonId && S.medication.persons.length) S.medication.currentPersonId = S.medication.persons[0].id;
    } catch(e){}
  }

  }

    renderTabBar();
    $('topTitle').textContent = PAGE_LABELS[key] || '生活小助手';

    if(window.scrollTo) window.scrollTo(0,0);
    if(key==='home') renderHome();
    if(key==='account') renderAccount();
    if(key==='recipe') renderRecipe();
    if(key==='supply') renderSupply();
    if(key==='pickup') renderPickup();
    if(key==='medication') renderMedication();
    if(key==='settings') renderSettings();
  }
  function renderTabBar(){
    var order = S.pages.order.filter(function(k){ return !S.pages.hidden[k]; });
    var tabs = order.slice();
    if(S.pages.tab5 && !S.pages.hidden[S.pages.tab5]) tabs.push(S.pages.tab5);
    tabs = tabs.slice(0,5);
    var bar = $('tabBar');
    bar.innerHTML = '<div class="tab-pill">' + tabs.map(function(k){
      return '<div class="tab-item '+(k===currentTab?'active':'inactive')+'" onclick="goPage(\''+k+'\')">'+ICONS[k]+'<span class="tab-label">'+PAGE_LABELS[k]+'</span></div>';

  function pickImage(cb){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    // 必须挂到 DOM 上，否则 Safari/iOS 等浏览器不会弹出文件选择框
    inp.style.position = 'fixed'; inp.style.left = '-9999px'; inp.style.top = '0';
    inp.onchange = function(){
      var f = inp.files[0]; if(!f){ document.body.removeChild(inp); return; }
      var r = new FileReader();
      r.onload = function(e){ document.body.removeChild(inp); cb(e.target.result); };

    };
    document.body.appendChild(inp);
    inp.click();
  }

  var lifeDragTimer = 0;
  function bindLifeDrag(grid){
    var dragEl = null, timer=null, dragging=false;
    function atPoint(x,y){ var items=grid.querySelectorAll('.life-index-item'); for(var i=0;i<items.length;i++){ var r=items[i].getBoundingClientRect(); if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return items[i]; } return null; }
    function reorder(a,b){ if(!a||!b||a===b) return; var items=Array.prototype.slice.call(grid.children); var ai=items.indexOf(a),bi=items.indexOf(b); grid.insertBefore(a, ai<bi?b.nextSibling:b); }
    grid.ontouchstart = function(e){ var it=e.target.closest('.life-index-item'); if(!it) return; var t=e.touches[0]; timer=setTimeout(function(){ dragging=true; dragEl=it; it.classList.add('dragging'); if(navigator.vibrate)navigator.vibrate(30); },350); };
    grid.ontouchmove = function(e){ if(timer){clearTimeout(timer);timer=null;} if(!dragging)return; e.preventDefault(); var tg=atPoint(e.touches[0].clientX,e.touches[0].clientY); if(tg&&tg!==dragEl) reorder(dragEl,tg); };
    grid.ontouchend = function(){ if(timer){clearTimeout(timer);timer=null;} if(dragEl){ dragEl.classList.remove('dragging'); dragEl=null; saveLifeOrder(); lifeDragTimer=Date.now(); } dragging=false; };
    grid.onmousedown = function(e){ var it=e.target.closest('.life-index-item'); if(!it) return; var tm=setTimeout(function(){ dragging=true; dragEl=it; it.classList.add('dragging'); },200);
      var mv=function(ev){ if(!dragging)return; ev.preventDefault(); var tg=atPoint(ev.clientX,ev.clientY); if(tg&&tg!==dragEl) reorder(dragEl,tg); };
      var up=function(){ clearTimeout(tm); if(dragEl){ dragEl.classList.remove('dragging'); dragEl=null; saveLifeOrder(); lifeDragTimer=Date.now(); } dragging=false; document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
    };
  }

  function calcStreak(hist){ if(!hist||!hist.length) return 0; var s=hist.slice().sort(); var d=new Date(); if(s.indexOf(todayStr())===-1) d.setDate(d.getDate()-1); var st=0; while(true){ var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(s.indexOf(ds)!==-1){st++;d.setDate(d.getDate()-1);} else break; } return st; }

  function setChartPeriod(b,p){ chartPeriod=p; document.querySelectorAll('#chartArea').forEach(function(){}); b.parentElement.querySelectorAll('.filter-pill').forEach(function(x){x.classList.remove('active');x.classList.add('inactive');}); b.classList.remove('inactive'); b.classList.add('active'); renderChart(); }

  function renderChart(){
    var area=$('chartArea'); if(!area) return;
    var now=new Date(); var filtered=S.account.records.filter(function(r){return r.type!=='necessity'&&r.type!=='wish';});
    if(chartPeriod==='today') filtered=filtered.filter(function(r){return r.date===todayStr();});
    else if(chartPeriod==='week'){ var d=new Date(now); var day=now.getDay()||7; d.setDate(now.getDate()-day+1); d.setHours(0,0,0,0); filtered=filtered.filter(function(r){return new Date(r.date)>=d;}); }
    else if(chartPeriod==='month'){ var ms=new Date(now.getFullYear(),now.getMonth(),1); filtered=filtered.filter(function(r){return new Date(r.date)>=ms;}); }
    else if(chartPeriod==='halfyear'){ var hs=new Date(now); hs.setMonth(now.getMonth()-6); filtered=filtered.filter(function(r){return new Date(r.date)>=hs;}); }
    if(chartScope!=='all') filtered=filtered.filter(function(r){return (r.scope||'personal')===chartScope;});
    var totals={}; EXPENSE_CATS.forEach(function(c){totals[c.name]=0;}); filtered.forEach(function(r){ if(r.type==='income') return; totals[r.cat]=(totals[r.cat]||0)+r.amount; });
    var total=Object.keys(totals).reduce(function(s,k){return s+totals[k];},0);
    var pl={today:'今日支出',week:'本周支出',month:'本月支出',halfyear:'近半年支出'}[chartPeriod];
    var svg='';
    if(total>0){ var r=50,circ=2*Math.PI*r,off=0,arcs=''; EXPENSE_CATS.forEach(function(c){ var am=totals[c.name]; if(am<=0)return; var dash=am/total*circ; arcs+='<circle cx="65" cy="65" r="'+r+'" stroke="'+c.color+'" stroke-width="22" fill="none" stroke-dasharray="'+dash.toFixed(1)+' '+(circ-dash).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 65 65)"/>'; off+=dash; }); svg='<svg width="120" height="120" viewBox="0 0 130 130">'+arcs+'<text x="65" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="var(--theme-text)">'+total.toFixed(0)+'</text><text x="65" y="78" text-anchor="middle" font-size="10" fill="var(--theme-text-secondary)">'+pl+'</text></svg>'; }
    else { svg='<svg width="120" height="120" viewBox="0 0 130 130"><circle cx="65" cy="65" r="50" stroke="var(--theme-border)" stroke-width="22" fill="none"/><text x="65" y="68" text-anchor="middle" font-size="12" fill="var(--theme-text-secondary)">暂无支出</text></svg>'; }
    var legend=EXPENSE_CATS.map(function(c){ var am=totals[c.name]||0; return '<div class="legend-item"><div class="legend-dot" style="background:'+c.color+'"></div><span class="legend-text">'+c.name+'</span><span class="legend-amount'+(am<=0?' zero':'')+'">'+money(am)+'</span></div>'; }).join('');
    area.innerHTML='<div class="doughnut-chart">'+svg+'</div><div class="legend-column">'+legend+'</div>';
  }

  function handleRIng(e){ if(e.key==='Enter'||e.key===','||e.key==='，'){ e.preventDefault(); var inp=$('rIngInput'); var parts=inp.value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean); parts.forEach(function(v){ if(tempIng.indexOf(v)===-1) tempIng.push(v); }); inp.value=''; renderTempIng(); } }
  function renderTempIng(){ var row=$('rIngRow'); if(!row) return; var inp=$('rIngInput'); row.querySelectorAll('.ingredient-input-tag').forEach(function(t){t.remove();}); tempIng.forEach(function(n){ var tag=el('<span class="ingredient-input-tag '+ingCatClass(n)+'" style="display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:500;">'+esc(n)+'<span style="cursor:pointer;opacity:0.6;" onclick="rmTempIng(\''+esc(n)+'\')">✕</span></span>'); row.insertBefore(tag,inp); }); }

    var b=$('setBody');
    if(setTab==='pages'){
      var order=S.pages.order;
      var fixedHtml=order.map(function(k,i){ var hidden=S.pages.hidden[k]; return '<div class="mgmt-item"><span class="mgmt-grip">⠿</span><span class="mgmt-name">'+PAGE_LABELS[k]+'</span>'
        + '<span class="mgmt-hide '+(hidden?'hidden-on':'')+'" onclick="togglePageHidden(\''+k+'\')">'+(hidden?'已隐藏':'隐藏')+'</span>'
        + '<span class="mgmt-del '+(i===0?'disabled':'')+'" onclick="movePage(\''+k+'\',-1)">↑</span>'
        + '<span class="mgmt-del '+(i===order.length-1?'disabled':'')+'" onclick="movePage(\''+k+'\',1)">↓</span></div>'; }).join('');

        + '<div class="card" style="margin-top:12px;"><div class="card-title" style="margin-bottom:12px;">字体粗细</div><div class="weight-pill-row"><div class="weight-pill '+(S.font.weight==400?'active':'')+'" onclick="setFontWeight(400)">常规</div><div class="weight-pill '+(S.font.weight==600?'active':'')+'" onclick="setFontWeight(600)">加粗</div></div></div>';
    } else if(setTab==='feedback'){
      b.innerHTML='<div class="settings-feedback-area"><textarea class="settings-feedback-input" id="fbText" maxlength="500" placeholder="请留下你的建议（不超过500字）" oninput="$(\'fbCount\').textContent=this.value.length+\'/500\'"></textarea><span class="settings-feedback-count" id="fbCount">0/500</span></div><button class="btn btn-green" onclick="submitFeedback()"><span class="btn-text">提交反馈</span></button>';
    }
  }
